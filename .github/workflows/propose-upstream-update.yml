name: Watch upstream Nuvio updates

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream release tag (e.g. 1.0.6, blank = latest published release)"
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-upstream-update
  cancel-in-progress: false

env:
  CANONICAL_BRANCH: webos4-chromium53
  UPSTREAM_REPOSITORY: NuvioMedia/NuvioTVSmart

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the canonical custom branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_BRANCH }}
          fetch-depth: 0

      - name: Resolve latest upstream release and fork base
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_REF" ]; then
            UPSTREAM_TAG="${REQUESTED_REF//[[:space:]]/}"
          else
            UPSTREAM_TAG="$(gh release view --repo "${UPSTREAM_REPOSITORY}" --json tagName -q .tagName)"
          fi
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $UPSTREAM_TAG" >> "$GITHUB_STEP_SUMMARY"

          # Resolve current fork incorporated upstream base from tags like v1.0.5+webos4.r5.1
          FORK_BASE="$(git tag -l 'v*+webos4.*' | sed 's/^v//; s/+webos4.*//' | sort -V | tail -1)"
          if [ -z "$FORK_BASE" ]; then
            FORK_BASE="1.0.5"
          fi
          echo "fork_base=$FORK_BASE" >> "$GITHUB_OUTPUT"
          echo "Current fork base: $FORK_BASE" >> "$GITHUB_STEP_SUMMARY"

          # Normalize tags with or without leading 'v' for comparison
          CLEAN_UPSTREAM="${UPSTREAM_TAG#v}"
          CLEAN_BASE="${FORK_BASE#v}"

          if [ "$CLEAN_UPSTREAM" = "$CLEAN_BASE" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "Fork is already at upstream base $UPSTREAM_TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "New upstream release detected: $UPSTREAM_TAG (current fork base: $FORK_BASE)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create or update tracking issue
        if: steps.resolve.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.upstream_tag }}
          BASE: ${{ steps.resolve.outputs.fork_base }}
        run: |
          set -euo pipefail
          TITLE="[Upstream Update] NuvioTVSmart $TAG (current fork base: $BASE)"

          # Prevent duplicate open issues for the same upstream release
          EXISTING_ISSUE="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number -q '.[0].number // empty')"
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Tracking issue #$EXISTING_ISSUE already exists for $TAG; skipping."
            exit 0
          fi

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || true
          git fetch --quiet upstream --tags

          # Resolve tag names for git log
          TARGET_TAG="$TAG"
          if ! git rev-parse "$TARGET_TAG" >/dev/null 2>&1 && git rev-parse "v$TARGET_TAG" >/dev/null 2>&1; then
            TARGET_TAG="v$TARGET_TAG"
          fi

          SOURCE_BASE="$BASE"
          if ! git rev-parse "$SOURCE_BASE" >/dev/null 2>&1 && git rev-parse "v$SOURCE_BASE" >/dev/null 2>&1; then
            SOURCE_BASE="v$SOURCE_BASE"
          fi

          COMMITS="$(git log --oneline --no-decorate "${SOURCE_BASE}..${TARGET_TAG}" 2>/dev/null | head -40 || echo '(unable to list commits between base and tag)')"

          INTERSECTING="$(comm -12 \
            <(git diff --name-only "${SOURCE_BASE}" "${TARGET_TAG}" 2>/dev/null | sort) \
            <(git diff --name-only "${SOURCE_BASE}" HEAD 2>/dev/null | sort) | head -40 || true)"

          cat <<EOF > /tmp/upstream-issue.md
          Upstream **${UPSTREAM_REPOSITORY}** đã phát hành phiên bản mới: **${TAG}**.
          Nhánh stable của fork (\`${CANONICAL_BRANCH}\`) hiện đang ở base: **${BASE}**.

          > ⚠️ **QUY TẮC AN TOÀN:**
          > - **KHÔNG** tự động merge toàn bộ upstream vào nhánh \`${CANONICAL_BRANCH}\`.
          > - **KHÔNG** auto-publish release.
          > - Chỉ **selective-port** các bản sửa lỗi và tính năng an toàn, kiểm tra tính tương thích với Chromium 53 trước khi merge.

          ## Upstream Commits
          \`\`\`text
          ${COMMITS}
          \`\`\`

          ## Các File Trùng Lặp (Dự Báo Vùng Cần Kiểm Tra Kỹ)
          \`\`\`text
          ${INTERSECTING:-Không có file trùng lặp trực tiếp}
          \`\`\`

          ## Checklist Nghiệm Thu Trước Khi Merge & Release
          - [ ] Tạo nhánh feature riêng: \`test/webos4-...\` từ \`${CANONICAL_BRANCH}\`.
          - [ ] Kiểm tra \`scripts/compatibilityPolicy.mjs\` giữ nguyên target 4.0.0 / Chromium 53.
          - [ ] Bảo toàn các fix đặc thù:
            - \`js/platform/index.js\` (nhận diện Chromium 53 -> webOS 4)
            - \`js/ui/components/gridPosterRecycler.js\` (recycling poster See All/Discover)
            - \`js/core/util/catalogEntryMapper.js\` (lọc malformed entry)
            - \`js/core/profile/librarySyncService.js\` (bảo vệ addon khi sync rỗng)
            - \`js/core/profile/homeCatalogSettingsSyncService.js\` (merge catalog cloud/local)
            - \`js/ui/screens/library/libraryScreen.js\` (chống chớp màn hình khi sync nền)
          - [ ] Các static gates đều pass:
            - \`npm run check:source\`
            - \`npm run check:no-undef\`
            - \`npm run check:legacy-regex\`
            - \`npm run check:legacy-css\`
            - \`npm run verify:webos53-policy\`
            - \`npm run test:webos4\`
          - [ ] Deploy và nghiệm thu thực tế trên TV LG webOS 4 vật lý.
          - [ ] Fast-forward merge vào \`${CANONICAL_BRANCH}\`, tạo tag \`v${TAG#v}+webos4.r<gen>.<rev>\`.
          - [ ] GitHub Actions tạo Draft Release -> kiểm tra file IPK -> Publish thủ công.
          EOF

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body-file /tmp/upstream-issue.md
