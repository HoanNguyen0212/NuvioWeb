<!doctype html>
<html
  lang="en"
  class="no-flex-gap no-css-math no-backdrop-filter no-aspect-ratio"
>
  <head>
    <script>
      window.__NUVIO_BOOT_EPOCH__ = typeof performance !== "undefined" && performance.now ? performance.now() : Date.now();
      window.__NUVIO_EARLY_BOOT_MARKS__ = { "html-start": 0 };
    </script>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <style>
      #boot-welcome {
        position: fixed;
        z-index: 2147483646;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: #0f1115;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
      }
      #boot-welcome img {
        width: 220px;
        max-width: 40vw;
        height: auto;
        margin-bottom: 24px;
      }
      #boot-welcome .boot-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #e50914;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script src="assets/runtime/legacy-features.js"></script>
    <script>
      (function configureTizenLaunch() {
        var root = typeof globalThis !== "undefined" ? globalThis : window;
        var search = String((window.location && window.location.search) || "").toLowerCase();
        var userAgent = String(
          (window.navigator && window.navigator.userAgent) || ""
        ).toLowerCase();
        var webapis = root.webapis || {};
        var isTizenLaunch = Boolean(
          root.__NUVIO_PLATFORM__ === "tizen" ||
          root.tizen ||
          root.avplay ||
          webapis.avplay ||
          webapis.avPlay ||
          webapis.productinfo ||
          search.indexOf("wrapper=tizen") !== -1 ||
          userAgent.indexOf("tizen") !== -1
        );

        if (!isTizenLaunch) {
          return;
        }

        root.__NUVIO_PLATFORM__ = "tizen";
        var viewport = document.querySelector("meta[name='viewport']");
        if (!viewport) {
          viewport = document.createElement("meta");
          viewport.name = "viewport";
          document.head.appendChild(viewport);
        }
        viewport.setAttribute(
          "content",
          "width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        );
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Nuvio TV</title>

    <link rel="stylesheet" href="css/base.css?v=20260509s" />
    <link rel="stylesheet" href="css/layout.css?v=20260509s" />
    <link rel="stylesheet" href="css/components.css?v=20260531supporters2" />
    <link rel="stylesheet" href="css/themes.css?v=20260509s" />
  </head>
  <body>
    <div id="boot-welcome">
      <img src="assets/brand/app_logo_wordmark.png" alt="Nuvio" />
      <div class="boot-spinner"></div>
    </div>
    <script src="boot-guard.js"></script>
    <script src="js/core/diagnostics/bootMetrics.js"></script>
    <script src="nuvio.env.js"></script>

    <script>
      (function markDirectBundleStart() {
        var now = typeof performance !== "undefined" && performance.now ? performance.now() : Date.now();
        var elapsed = Math.max(0, Math.round(now - window.__NUVIO_BOOT_EPOCH__));
        window.__NUVIO_EARLY_BOOT_MARKS__["compat-start"] = elapsed;
        window.__NUVIO_EARLY_BOOT_MARKS__["compat-ready"] = elapsed;
        window.__NUVIO_EARLY_BOOT_MARKS__["bundle-start"] = elapsed;
      })();
    </script>
    <script
      src="app.bundle.js?v=20260818r4c6"
      onerror="window.NuvioBootGuard && window.NuvioBootGuard.scriptFailed(this.src)"
    ></script>
  </body>
</html>
