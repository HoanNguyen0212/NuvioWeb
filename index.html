    <script>
      window.__NUVIO_BOOT_MARKS__ = [];
      window.__NUVIO_BOOT_MARK__ = function (name) {
        var now = typeof performance !== "undefined" && performance.now ? performance.now() : Date.now();
        window.__NUVIO_BOOT_MARKS__.push({ name: name, t: Math.round(now) });
        if (name === "home-focused" || name === "home-mounted") {
          try {
            var first = window.__NUVIO_BOOT_MARKS__[0] ? window.__NUVIO_BOOT_MARKS__[0].t : 0;
            var summary = window.__NUVIO_BOOT_MARKS__.map(function (m) {
              return m.name + ":" + (m.t - first) + "ms";
            }).join(" | ");
            console.log("[nuvio-boot-marks] " + summary);
          } catch (_) {}
        }
      };
      window.__NUVIO_BOOT_MARK__("boot-start");
    </script>
    <script>
      (function configureTizenLaunch() {
        var root = typeof globalThis !== "undefined" ? globalThis : window;
        var search = String((window.location && window.location.search) || "").toLowerCase();
        var userAgent = String(
          (window.navigator && window.navigator.userAgent) || ""
        ).toLowerCase();
        var webapis = root.webapis || {};
        var isTizenLaunch = Boolean(
          root.__NUVIO_PLATFORM__ === "tizen" ||
          root.tizen ||
          root.avplay ||
          webapis.avplay ||
          webapis.avPlay ||
          webapis.productinfo ||
          search.indexOf("wrapper=tizen") !== -1 ||
          userAgent.indexOf("tizen") !== -1
        );

        if (!isTizenLaunch) {
          return;
        }

        root.__NUVIO_PLATFORM__ = "tizen";
        var viewport = document.querySelector("meta[name='viewport']");
        if (!viewport) {
          viewport = document.createElement("meta");
          viewport.name = "viewport";
          document.head.appendChild(viewport);
        }
        viewport.setAttribute(
          "content",
          "width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        );
      })();
    </script>
